name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      DEPLOY_PATH: ~/borsibaar
      DOCKER_COMPOSE_FILE: docker-compose.yaml
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      IMAGE_TAG: ${{ github.sha }}
      GH_CLOUD_REGISTRY: ghcr.io/${{ github.repository_owner }}
      DOCKER_USER: ${{ github.actor }}
      DOCKER_PW: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build backend
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      - name: building docker images
        run: |
          docker build -f backend/Dockerfile -t $GH_CLOUD_REGISTRY/borsibaar34-back:$IMAGE_TAG backend
          docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_BACKEND_URL=$BACKEND_URL -t $GH_CLOUD_REGISTRY/borsibaar34-front:$IMAGE_TAG .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push to registry
        run: |
          docker push $GH_CLOUD_REGISTRY/borsibaar34-back:$IMAGE_TAG
          docker push $GH_CLOUD_REGISTRY/borsibaar34-front:$IMAGE_TAG

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Install and openssh-client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SERVER_IP" << EOF
          set -e

          mkdir -p $DEPLOY_PATH
          cd $DEPLOY_PATH

          # Check if docker-compose file exists
          if [ ! -f "$DOCKER_COMPOSE_FILE" ]; then
            echo "ERROR: $DOCKER_COMPOSE_FILE not found!"
            exit 1
          fi

          # Update image tag in .env
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env

          docker login ghcr.io -u $DOCKER_USER -p $DOCKER_PW
          docker pull $GH_CLOUD_REGISTRY/borsibaar34-back:$IMAGE_TAG
          docker pull $GH_CLOUD_REGISTRY/borsibaar34-front:$IMAGE_TAG

          # Rebuild and start containers
          docker compose -f "$DOCKER_COMPOSE_FILE" up -d  --remove-orphans

          # Clean up old images
          docker image prune -f

          echo "Deployment complete!"
          docker compose -f "$DOCKER_COMPOSE_FILE" ps
          EOF
